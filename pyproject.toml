[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[project]
name = "zhuk"
version = "1.2.0"
description = "Download Spotify tracks and playlists as MP3 from YouTube"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47.0",
    "spotipy>=2.26.0",
    "yt-dlp>=2026.3.13",
    "rapidfuzz>=3.0.0",
    "click>=8.3.3",
]

[project.scripts]
zhuk = "zhuk.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
